site_name: soif-app
site_description: A self-hostable dashboard for the freshwater your LLM usage consumed.
site_url: https://unchained-labs.github.io/soif-app/
repo_url: https://github.com/Unchained-Labs/soif-app
repo_name: Unchained-Labs/soif-app
copyright: Unchained Labs · Apache-2.0 · estimates, not measurements

theme:
  name: material
  logo: assets/mark-accent.svg
  favicon: assets/favicon.svg
  # Brand fonts are loaded by extra.css, which needs all three faces —
  # Material's own `font:` option only wires up two.
  font: false
  # Dark first: every tool in this org is terminal-adjacent, and the brand
  # tokens are authored against a dark ground. Light is supported, not primary.
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  # tokens.css is vendored from Unchained-Labs/branding and must not be edited
  # here; extra.css only maps Material's variables onto those tokens.
  - assets/tokens.css
  - assets/extra.css

nav:
  - Home: index.md
  - Install: install.md
  - Sources: sources.md
  - Dashboard: dashboard.md
  - Methodology: methodology.md
  - Architecture: architecture.md
  - Security: security.md

markdown_extensions:
  - admonition
  # Resolves the :material-*: / :octicons-*: shortcodes into inline SVG. Without
  # it Material's own icon syntax renders as literal text on the page.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Unchained-Labs
